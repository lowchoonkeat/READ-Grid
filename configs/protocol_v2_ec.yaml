  frozen_date: '2026-10-16'
  supersedes: 1.0.0-frozen
  evaluation_nature: post_hoc_exploratory
  exposure_record: docs/test_exposure_record.md
  preregistration: docs/v2_preregistration.md
  ec_extension: Adds ONLY the fault F3E = outage 17:00-24:00 (start_s 61200, duration_s 25200), the E-C
    stress scenario 'the outage covers the whole evening DR window'. Every other key holds the frozen
    protocol_v2 value. The frozen protocol is NOT modified, so its S0 hash stays valid.
  ec_extension_base_sha256: 8639ff7e0630b2ab6b8b0e134701182d3a2df559e0b8270f74bb4b266116b0de
